<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>3しょくしょくひんぐん 分類ゲーム</title>
  <style>
    * {
      box-sizing: border-box;
      touch-action: manipulation;
    }
    body {
      font-family: "M PLUS Rounded 1c", "Hiragino Kaku Gothic ProN", Arial, sans-serif;
      background-color: #f0f9ff;
      text-align: center;
      margin: 0;
      padding: 10px;
      user-select: none;
      -webkit-user-select: none;
      overflow-x: hidden;
    }
    
    .screen {
      display: none;
      max-width: 800px;
      margin: 0 auto;
    }
    .screen.active {
      display: block;
    }

    h1 {
      font-size: 26px;
      color: #0f172a;
      margin: 10px 0;
    }

    /* ボタン共通スタイル */
    .btn {
      font-size: 20px;
      font-weight: bold;
      padding: 12px 24px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: transform 0.1s, background-color 0.2s;
      margin: 8px;
    }
    .btn:active {
      transform: scale(0.95);
    }
    .btn-primary { background-color: #0284c7; color: white; }
    .btn-secondary { background-color: #10b981; color: white; }
    .btn-warning { background-color: #f59e0b; color: white; }

    /* スタート画面 */
    .start-card {
      background: white;
      padding: 20px;
      border-radius: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      margin-top: 10px;
    }
    .mode-buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 320px;
      margin: 20px auto;
    }

    /* ゲーム画面Header */
    .header-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: white;
      padding: 10px 20px;
      border-radius: 16px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      margin-bottom: 15px;
    }
    .info-box {
      font-size: 20px;
      font-weight: bold;
      color: #334155;
    }
    .info-value {
      font-size: 26px;
      color: #0284c7;
    }

    /* 食材表示エリア */
    #food-container {
      height: 140px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 15px;
    }
    .food-card {
      font-size: 50px;
      padding: 10px 25px;
      background: white;
      border: 3px solid #cbd5e1;
      border-radius: 20px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.1);
      cursor: grab;
      touch-action: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 160px;
      z-index: 100;
    }
    .food-card.selected {
      border-color: #0284c7;
      background-color: #e0f2fe;
    }
    .food-name {
      font-size: 18px;
      font-weight: bold;
      margin-top: 2px;
      color: #1e293b;
    }

    /* 3色カゴエリア */
    #drop-zones {
      display: flex;
      justify-content: space-around;
      gap: 10px;
    }
    .zone {
      flex: 1;
      height: 220px;
      border-radius: 20px;
      border: 4px dashed;
      padding: 10px 5px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: transform 0.15s, background-color 0.2s;
    }
    .zone-title {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 4px;
    }
    .zone-sub {
      font-size: 12px;
      font-weight: bold;
      line-height: 1.3;
    }

    #red-zone { border-color: #ef4444; background-color: #fef2f2; color: #991b1b; }
    #yellow-zone { border-color: #eab308; background-color: #fefce8; color: #854d0e; }
    #green-zone { border-color: #22c55e; background-color: #f0fdf4; color: #166534; }

    /* ランキング */
    .ranking-list {
      text-align: left;
      max-width: 320px;
      margin: 15px auto;
      background: #f8fafc;
      padding: 15px 25px;
      border-radius: 16px;
    }
    .ranking-item {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px dashed #cbd5e1;
      font-weight: bold;
    }

    /* モーダル */
    .modal {
      display: none;
      position: fixed;
      top:0; left:0; width:100%; height:100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-content {
      background: white;
      padding: 25px;
      border-radius: 20px;
      max-width: 340px;
      width: 90%;
      text-align: center;
    }
    input[type="text"] {
      font-size: 18px;
      padding: 8px 12px;
      width: 80%;
      margin: 15px 0;
      border: 2px solid #cbd5e1;
      border-radius: 8px;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- 1. スタート画面 -->
  <div id="start-screen" class="screen active">
    <h1>3しょく しょくひんぐん<br>ぶんるいゲーム</h1>
    <div class="start-card">
      <p style="font-size: 16px; color: #475569; font-weight: bold;">
        たべものを 正しいグループのカゴに<br>わけていこう！
      </p>
      
      <div class="mode-buttons">
        <button class="btn btn-primary" onclick="startGame('challenge')">⏱️ 30びょう チャレンジ</button>
        <button class="btn btn-secondary" onclick="startGame('practice')">🔰 れんしゅう モード</button>
      </div>

      <div class="ranking-list">
        <h3 style="margin: 0 0 10px 0; text-align: center; color: #0284c7;">🏆 ベスト記録（TOP 5）</h3>
        <div id="ranking-container">
          <!-- ここに順位が表示されます -->
        </div>
      </div>
    </div>
  </div>

  <!-- 2. ゲーム画面 -->
  <div id="game-screen" class="screen">
    <div class="header-info">
      <div class="info-box">てんすう: <span id="score-val" class="info-value">0</span></div>
      <div class="info-box" id="timer-box">のこり: <span id="timer-val" class="info-value">30</span>びょう</div>
    </div>

    <div id="food-container">
      <!-- 食材カードが入ります -->
    </div>

    <div id="drop-zones">
      <div id="red-zone" class="zone" data-group="red" onclick="handleZoneClick('red')">
        <div class="zone-title">あか</div>
        <div class="zone-sub">体をつくる<br>(ち や にく)</div>
      </div>
      <div id="yellow-zone" class="zone" data-group="yellow" onclick="handleZoneClick('yellow')">
        <div class="zone-title">きいろ</div>
        <div class="zone-sub">熱や力になる<br>(エネルギー)</div>
      </div>
      <div id="green-zone" class="zone" data-group="green" onclick="handleZoneClick('green')">
        <div class="zone-title">みどり</div>
        <div class="zone-sub">調子を整える<br>(びょうき予防)</div>
      </div>
    </div>

    <button class="btn btn-warning" style="margin-top: 20px;" onclick="showStartScreen()">タイトルへもどる</button>
  </div>

  <!-- 名前入力モーダル -->
  <div id="name-modal" class="modal">
    <div class="modal-content">
      <h2>🎉 ゲーム終了！</h2>
      <p style="font-size: 18px; font-weight: bold;">とくてん: <span id="final-score" style="color:#0284c7;">0</span> てん</p>
      <p>なまえを入力して記録しよう！</p>
      <input type="text" id="player-name" maxlength="8" placeholder="なまえ (8もじまで)">
      <br>
      <button class="btn btn-primary" onclick="saveScore()">きろくする</button>
    </div>
  </div>

  <script>
    // 食材データ（※バナナを削除し、ぶどうを追加）
    const foods = [
      { name: "ぶたにく", emoji: "🥩", group: "red" },
      { name: "さかな", emoji: "🐟", group: "red" },
      { name: "たまご", emoji: "🥚", group: "red" },
      { name: "とうふ", emoji: "🟩", group: "red" },
      { name: "ぎゅうにゅう", emoji: "🥛", group: "red" },
      { name: "ごはん", emoji: "🍚", group: "yellow" },
      { name: "パン", emoji: "🍞", group: "yellow" },
      { name: "めん", emoji: "🍜", group: "yellow" },
      { name: "いも", emoji: "🥔", group: "yellow" },
      { name: "トマト", emoji: "🍅", group: "green" },
      { name: "ぶどう", emoji: "🍇", group: "green" },
      { name: "キャベツ", emoji: "🥬", group: "green" },
      { name: "きのこ", emoji: "🍄", group: "green" }
    ];

    let gameMode = 'challenge';
    let score = 0;
    let timeLeft = 30;
    let timerId = null;
    let currentFood = null;

    // Web Audio API による効果音発声
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'ok') {
        osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
        osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.25);
      } else if (type === 'ng') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      }
    }

    // 画面切り替え
    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    function showStartScreen() {
      if (timerId) clearInterval(timerId);
      loadRanking();
      showScreen('start-screen');
    }

    // ゲーム開始
    function startGame(mode) {
      gameMode = mode;
      score = 0;
      document.getElementById('score-val').textContent = score;

      if (gameMode === 'challenge') {
        timeLeft = 30;
        document.getElementById('timer-box').style.display = 'block';
        document.getElementById('timer-val').textContent = timeLeft;
        timerId = setInterval(() => {
          timeLeft--;
          document.getElementById('timer-val').textContent = timeLeft;
          if (timeLeft <= 0) {
            clearInterval(timerId);
            endGame();
          }
        }, 1000);
      } else {
        document.getElementById('timer-box').style.display = 'none';
      }

      showScreen('game-screen');
      nextFood();
    }

    // 次の食材をセット
    function nextFood() {
      const container = document.getElementById('food-container');
      container.innerHTML = '';

      const randomIndex = Math.floor(Math.random() * foods.length);
      currentFood = foods[randomIndex];

      const card = document.createElement('div');
      card.className = 'food-card';
      card.innerHTML = `<span>${currentFood.emoji}</span><span class="food-name">${currentFood.name}</span>`;

      setupDrag(card);
      container.appendChild(card);
    }

    // カゴをタップしたときの処理（タップ選択対応）
    function handleZoneClick(selectedGroup) {
      if (!currentFood) return;
      checkAnswer(selectedGroup);
    }

    // 回答チェック
    function checkAnswer(selectedGroup) {
      if (selectedGroup === currentFood.group) {
        playSound('ok');
        score += 10;
        document.getElementById('score-val').textContent = score;
      } else {
        playSound('ng');
      }
      nextFood();
    }

    // タッチドラッグ処理
    function setupDrag(element) {
      let active = false, currentX = 0, currentY = 0, initialX = 0, initialY = 0;

      element.addEventListener('touchstart', (e) => {
        initialX = e.touches[0].clientX - currentX;
        initialY = e.touches[0].clientY - currentY;
        active = true;
      }, false);

      element.addEventListener('touchmove', (e) => {
        if (active) {
          e.preventDefault();
          currentX = e.touches[0].clientX - initialX;
          currentY = e.touches[0].clientY - initialY;
          element.style.transform = `translate3d(${currentX}px, ${currentY}px, 0)`;
        }
      }, false);

      element.addEventListener('touchend', (e) => {
        if (!active) return;
        active = false;
        const touch = e.changedTouches[0];
        const target = document.elementFromPoint(touch.clientX, touch.clientY);
        const zone = target ? target.closest('.zone') : null;

        if (zone) {
          const selectedGroup = zone.getAttribute('data-group');
          checkAnswer(selectedGroup);
        } else {
          element.style.transform = 'translate3d(0px, 0px, 0px)';
          currentX = 0;
          currentY = 0;
        }
      }, false);
    }

    // 終了処理
    function endGame() {
      document.getElementById('final-score').textContent = score;
      document.getElementById('name-modal').style.display = 'flex';
    }

    // スコア保存（ローカルストレージ）
    function saveScore() {
      const nameInput = document.getElementById('player-name').value.trim() || 'ななし';
      let rankings = JSON.parse(localStorage.getItem('food_game_rankings') || '[]');
      rankings.push({ name: nameInput, score: score });
      rankings.sort((a, b) => b.score - a.score);
      rankings = rankings.slice(0, 5); // TOP5のみ保存

      localStorage.setItem('food_game_rankings', JSON.stringify(rankings));
      document.getElementById('name-modal').style.display = 'none';
      document.getElementById('player-name').value = '';
      showStartScreen();
    }

    // ランキング読み込み
    function loadRanking() {
      const rankings = JSON.parse(localStorage.getItem('food_game_rankings') || '[]');
      const container = document.getElementById('ranking-container');
      
      if (rankings.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:#94a3b8;">まだ きろくが ありません</p>';
        return;
      }

      container.innerHTML = rankings.map((r, i) => `
        <div class="ranking-item">
          <span>${i + 1}位: ${r.name}</span>
          <span style="color:#0284c7;">${r.score} 点</span>
        </div>
      `).join('');
    }

    // 初期化
    loadRanking();
  </script>
</body>
</html>
