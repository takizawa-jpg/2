<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>3しょくしょくひんぐん 分類ゲーム</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800;900&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'M PLUS Rounded 1c', sans-serif;
      touch-action: manipulation;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      background: linear-gradient(135deg, #e0f2fe 0%, #f0f9ff 50%, #fef3c7 100%);
      min-height: 100vh;
      overflow-x: hidden;
    }

    @keyframes pulse-subtle {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }
    .animate-pulse-subtle {
      animation: pulse-subtle 2s infinite ease-in-out;
    }

    @keyframes pop-in {
      0% { transform: scale(0.6); opacity: 0; }
      70% { transform: scale(1.08); opacity: 1; }
      100% { transform: scale(1); }
    }
    .animate-pop {
      animation: pop-in 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    .animate-shake {
      animation: shake 0.4s ease-in-out;
    }

    /* Floating drag ghost for iOS Safari */
    #touch-ghost {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%) scale(1.1);
      filter: drop-shadow(0 15px 15px rgba(0,0,0,0.25));
      display: none;
    }

    .dragging {
      opacity: 0.3;
      transform: scale(0.92);
    }
  </style>
</head>
<body class="flex flex-col min-h-screen text-slate-800 antialiased selection:bg-none">

  <div id="touch-ghost" class="bg-white rounded-2xl p-4 border-4 border-indigo-400 text-center shadow-2xl flex flex-col items-center justify-center min-w-[120px]">
    <span id="ghost-emoji" class="text-5xl mb-1">🍎</span>
    <span id="ghost-name" class="text-lg font-extrabold text-slate-800">リンゴ</span>
  </div>

  <header class="w-full bg-white/90 backdrop-blur-md border-b-4 border-slate-200/80 px-4 py-2 flex items-center justify-between sticky top-0 z-30 shadow-sm">
    <div class="flex items-center gap-2">
      <div class="bg-gradient-to-tr from-amber-400 to-red-400 text-white rounded-2xl p-2 shadow-md">
        <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C20.832 18.477 19.247 18 17.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
      </div>
      <div>
        <h1 class="text-xl md:text-2xl font-black bg-gradient-to-r from-red-500 via-amber-500 to-emerald-600 bg-clip-text text-transparent">
          3しょくしょくひんぐん ゲーム
        </h1>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <button onclick="openRankingModal()" class="px-3 py-1.5 sm:px-4 sm:py-2 bg-amber-400 hover:bg-amber-500 text-amber-950 font-black rounded-xl border-b-4 border-amber-600 shadow-md transition transform active:scale-95 text-xs sm:text-sm flex items-center gap-1">
        <span>🏆</span> ランキング
      </button>
      <button id="sound-toggle-btn" onclick="toggleSound()" class="p-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl border-b-4 border-slate-300 font-bold text-lg">
        🔊
      </button>
    </div>
  </header>

  <main class="flex-1 max-w-6xl w-full mx-auto p-3 sm:p-5 flex flex-col justify-center">

    <!-- 1. START SCREEN (TITLE SCREEN) -->
    <section id="screen-start" class="flex flex-col items-center justify-center text-center py-6 animate-pop">
      <div class="bg-white/90 backdrop-blur-md border-4 border-indigo-200 rounded-3xl p-6 sm:p-10 shadow-2xl max-w-xl w-full flex flex-col items-center">
        
        <div class="flex justify-center items-center gap-3 mb-4 text-5xl sm:text-6xl animate-bounce">
          <span>🥩</span><span>🍚</span><span>🥦</span>
        </div>

        <h2 class="text-2xl sm:text-4xl font-black text-slate-800 mb-3">
          3しょく しょくひんぐん<br><span class="text-indigo-600">ぶんるい パズル</span>
        </h2>
        
        <p class="text-slate-600 font-bold text-xs sm:text-sm mb-6 leading-relaxed">
          でてくる食材（たべもの）を<br>
          <span class="text-red-500 font-black">【あか】</span>
          <span class="text-amber-500 font-black">【きいろ】</span>
          <span class="text-emerald-600 font-black">【みどり】</span>
          のカゴへわけてね！
        </p>

        <!-- Mode Select Buttons -->
        <div class="w-full space-y-3 mb-6">
          <label class="block text-xs font-black text-slate-500 text-left px-1">▼ モードをえらんでスタート</label>

          <button onclick="startGame('challenge')" class="w-full py-4 bg-gradient-to-r from-red-500 to-amber-500 hover:from-red-600 hover:to-amber-600 text-white font-black text-lg sm:text-xl rounded-2xl shadow-lg border-b-4 border-red-700 transform active:scale-95 transition flex items-center justify-center gap-2 animate-pulse-subtle">
            <span>⏱️</span> 30びょう チャレンジ！（ランキング対応）
          </button>

          <button onclick="startGame('hard')" class="w-full py-3.5 bg-gradient-to-r from-purple-600 to-rose-600 hover:from-purple-700 hover:to-rose-700 text-white font-black text-base sm:text-lg rounded-2xl shadow
